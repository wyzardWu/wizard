[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wizard"
version = "0.1.0"
description = "Wizard: a real-time playable world model built on Wan2.2-TI2V-5B"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["wizard*"]
